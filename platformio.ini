; --- Onyx Picco / BOOX Tiles — ESP32-S3, 16MB flash / 8MB octal PSRAM ----------
; 3.97" 800x480 SSD1677/SSD2677 (auto-detected), capacitive touch, warm/cool I2C
; frontlight, SGM41562 charger, slide switch. The stock image declares 16MB flash
; and its app alone is ~9MB. Builds target the STOCK partition table
; (partitions_picco.csv) and `pio run -t upload` writes only the app into the
; stock `app` slot at 0xE0000, so the vendor bootloader, NVS and the safeboot
; recovery partition survive. The same firmware.bin works with the stock web
; flasher's "OTA update" mode. Native 4-bit SDMMC + USB-MSC file transfer as on
; the X4 Pro.
;   pio run -e picco -t upload
[env:picco]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
board_build.partitions = partitions_picco.csv
extra_scripts =
  ${base.extra_scripts}
  post:scripts/app_only_upload.py
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_PICCO=1
  -DFREEINK_CAP_USB_MSC=1
  -DBOARD_HAS_PSRAM
  -DUSB_PRODUCT=\"CrossPoint_Picco\"
  -DUSB_MANUFACTURER=\"CrossPoint\"
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-picco\"
  -DENABLE_SERIAL_LOG
  -DCROSSPOINT_WAIT_FOR_USB_SERIAL
  -DLOG_LEVEL=2
  ; Picco SD is native SDMMC (4-bit), mounted through SdFat's block-device API.
  -DUSE_BLOCK_DEVICE_INTERFACE=1

