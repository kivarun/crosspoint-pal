; Dev-only diagnostic for p0-rtc-clock: controlled RC_SLOW / XTAL32K selection
; and a timer-wake measurement loop. Adds no production surface; every extra
; byte is compiled out of all other environments.
;   pio run -e x4c-rtcclk -t upload
[env:x4c-rtcclk]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
build_flags =
  ${env:x4c.build_flags}
  -DCROSSPOINT_RTC_CLK_DIAG=1

; --- X4C BLE light-sleep diagnostic (P1-B0a/B0b) ------------------------------
; Rebuilt-core diagnostic: RTC slow clock on the external 32k crystal, BLE
; controller modem sleep with that LPCLK, esp_pm automatic light sleep, and a
; 500 ms companion connection interval. USB-MSC stays enabled: the TinyUSB
; component the prebuilt core was built from is restored by
; scripts/fetch_arduino_tinyusb.sh — run that once before the first build of
; this env, or UsbMassStorage fails to compile. Swapping between chip families
; with custom_sdkconfig forces a framework reinstall and full rebuild;
; production envs are untouched.
;   scripts/fetch_arduino_tinyusb.sh && pio run -e x4c-blelp -t upload
[env:x4c-blelp]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
custom_sdkconfig =
  ${firmware_tuned.custom_sdkconfig}
  ; The companion is a peripheral that advertises: the page-turner profile
  ; (reached through firmware_tuned above) narrows these roles for its
  ; central-only use; restore them.
  CONFIG_BT_NIMBLE_ROLE_PERIPHERAL=y
  CONFIG_BT_NIMBLE_ROLE_BROADCASTER=y
  CONFIG_RTC_CLK_SRC_EXT_CRYS=y
  CONFIG_PM_ENABLE=y
  CONFIG_FREERTOS_USE_TICKLESS_IDLE=y
  CONFIG_BT_CTRL_MODEM_SLEEP=y
  CONFIG_BT_CTRL_LPCLK_SEL_EXT_32K_XTAL=y
  ; TinyUSB restored from the prebuilt core's component (see
  ; scripts/fetch_arduino_tinyusb.sh); USBMSC.h needs these symbols to expose
  ; the MSC class.
  CONFIG_TINYUSB_ENABLED=y
  CONFIG_TINYUSB_MSC_ENABLED=y
build_flags =
  ${env:x4c.build_flags}
  -DCROSSPOINT_BLE_LIGHT_SLEEP_DIAG=1
  ; The P0 RTC diagnostic rides along (RTCCLK/RTCLOOP/RTCCAL + boot ring
  ; dump): the UAT needs a same-binary XTAL32K deep check if BLE looks
  ; unstable. Reviewed and hardware-proven in the P0 handoff.
  -DCROSSPOINT_RTC_CLK_DIAG=1
  ; p1-b1b: USB-MSC event ring for the failure investigation. All observation
  ; points are link-time interpositions (--wrap) so the production sources
  ; stay byte-untouched and the x4c binary stays identical. Pass-through
  ; except where noted below; production envs carry neither flag.
  -DCROSSPOINT_USB_MSC_DIAG=1
  -Wl,--wrap=_ZN10HalStorage5beginEv
  -Wl,--wrap=_ZN10HalStorage13beginUsbDriveEv
  -Wl,--wrap=_ZN7freeink14UsbMassStorage5beginEP22FsBlockDeviceInterface
  -Wl,--wrap=_ZN10HalStorage22disconnectUsbDriveHostEv
  -Wl,--wrap=_ZN10HalStorage11endUsbDriveEv
  -Wl,--wrap=_ZNK10HalStorage13usbDriveStateEv
  -Wl,--wrap=_ZNK10HalStorage21usbDriveHostSuspendedEv
  -Wl,--wrap=_ZN15ActivityManager4loopEv
  -Wl,--wrap=sdmmc_read_sectors
  -Wl,--wrap=sdmmc_write_sectors
  ; p1-b1d: raw TinyUSB flag flips (tud_mounted/tud_suspended) to timestamp
  ; the mounted drop independently of the HAL poll cadence.
  -Wl,--wrap=tud_mounted
  -Wl,--wrap=tud_suspended
  ; p1-b1g: EPD refresh isolation — the SPI byte movers (SPIClass::transfer /
  ; writeBytes, the ELF-proven funnel of every panel byte) skip the real call
  ; while an MSC session is active, so no waveform can start. See the p1-b1g
  ; report for the call-site census that justifies the point. Re-run that
  ; census after an Arduino-core bump, an SDK display-stack change, or a
  ; board SPI-map change: a stale mangled name silently unhooks the gate.
  -Wl,--wrap=_ZN8SPIClass8transferEh
  -Wl,--wrap=_ZN8SPIClass10writeBytesEPKhm
  ; AUTOLS defaults to 1 in BleLightSleepDiag.h; the control env below
  ; defines 0 as its only AUTOLS define (a second definition here would
  ; redefine the macro in every translation unit of the control build).
  ; The MSCDIAG block above is copied verbatim into [env:x4c-coreonly],
  ; [env:x4c-pmonly] and [env:x4c-pm80] — keep the four lists in lockstep
  ; when adding or changing a wrap.
extra_scripts =
  ${base.extra_scripts}
  post:scripts/restore_libs_sdkconfig.py

; Control twin of x4c-blelp: identical sdkconfig and pipeline; the only
; difference is `-DCROSSPOINT_BLE_LIGHT_SLEEP_AUTOLS=0`, which turns automatic
; light sleep off at esp_pm_configure — the USB-MSC baseline for the P1-B1
; UAT (no USB-MSC stubs). The sdkconfig, build flags and extra scripts are
; inherited from x4c-blelp by reference; the four board lines below are
; literal copies of x4c-blelp's, so change them together.
[env:x4c-blelp-nols]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
custom_sdkconfig = ${env:x4c-blelp.custom_sdkconfig}
build_flags =
  ${env:x4c-blelp.build_flags}
  -DCROSSPOINT_BLE_LIGHT_SLEEP_AUTOLS=0
extra_scripts = ${env:x4c-blelp.extra_scripts}

; P1-B1j: rebuilt-core control without the BLE light-sleep cluster. Separates
; "the hybrid rebuild itself" from "the light-sleep options added for the BLE
; diagnostics" in the USB-MSC failure (p1-b1i REPORT §4). Same rebuilt-core
; recipe, TinyUSB restore and MSCDIAG instrumentation as x4c-blelp-nols; the
; PM/tickless/modem-sleep/EXT-32K options are absent, and so is their runtime
; initialization: without CROSSPOINT_BLE_LIGHT_SLEEP_DIAG the boot no longer
; runs blelightsleepdiag::begin() (the boot-time esp_pm_configure). The P0 RTC
; diagnostic is not carried either (it would re-apply the scratch-selected RTC
; slow-clock source at boot — an independent variable this experiment must not
; have). The board lines, the wrap list and extra_scripts below are literal
; copies of x4c-blelp's/nols's, so change them together. Production
; envs untouched.
;   pio run -e x4c-coreonly -t upload
[env:x4c-coreonly]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
custom_sdkconfig =
  ${firmware_tuned.custom_sdkconfig}
  ; Same NimBLE role restoration as x4c-blelp: the companion builds and runs
  ; here too — the radio stack is not the variable under test.
  CONFIG_BT_NIMBLE_ROLE_PERIPHERAL=y
  CONFIG_BT_NIMBLE_ROLE_BROADCASTER=y
  ; TinyUSB restored from the prebuilt core's component (see
  ; scripts/fetch_arduino_tinyusb.sh); USBMSC.h needs these symbols to expose
  ; the MSC class.
  CONFIG_TINYUSB_ENABLED=y
  CONFIG_TINYUSB_MSC_ENABLED=y
  ; Deliberately absent vs x4c-blelp: CONFIG_RTC_CLK_SRC_EXT_CRYS,
  ; CONFIG_PM_ENABLE, CONFIG_FREERTOS_USE_TICKLESS_IDLE,
  ; CONFIG_BT_CTRL_MODEM_SLEEP, CONFIG_BT_CTRL_LPCLK_SEL_EXT_32K_XTAL — the
  ; light-sleep cluster the P1-B1j experiment isolates.
build_flags =
  ${env:x4c.build_flags}
  ; p1-b1j: the MSCDIAG instrumentation, copied verbatim from [env:x4c-blelp]
  ; (env:x4c itself does NOT carry it). Link-time interpositions only;
  ; production sources stay byte-untouched. Re-run the p1-b1g call-site census
  ; after an Arduino-core bump, an SDK display-stack change, or a board
  ; SPI-map change: a stale mangled name silently unhooks the gate.
  -DCROSSPOINT_USB_MSC_DIAG=1
  -Wl,--wrap=_ZN10HalStorage5beginEv
  -Wl,--wrap=_ZN10HalStorage13beginUsbDriveEv
  -Wl,--wrap=_ZN7freeink14UsbMassStorage5beginEP22FsBlockDeviceInterface
  -Wl,--wrap=_ZN10HalStorage22disconnectUsbDriveHostEv
  -Wl,--wrap=_ZN10HalStorage11endUsbDriveEv
  -Wl,--wrap=_ZNK10HalStorage13usbDriveStateEv
  -Wl,--wrap=_ZNK10HalStorage21usbDriveHostSuspendedEv
  -Wl,--wrap=_ZN15ActivityManager4loopEv
  -Wl,--wrap=sdmmc_read_sectors
  -Wl,--wrap=sdmmc_write_sectors
  -Wl,--wrap=tud_mounted
  -Wl,--wrap=tud_suspended
  -Wl,--wrap=_ZN8SPIClass8transferEh
  -Wl,--wrap=_ZN8SPIClass10writeBytesEPKhm
extra_scripts =
  ${base.extra_scripts}
  post:scripts/restore_libs_sdkconfig.py

; P1-B1k: PM/DFS-only experiment on top of the p1-b1j control (x4c-coreonly,
; PASS). Adds only CONFIG_PM_ENABLE, with tickless idle and BT modem sleep
; explicitly off and EXT-32K/LPCLK untouched, plus the minimal runtime
; initialization: pmonlydiag::begin() applies the esp_pm_configure DFS range
; with automatic light sleep off — the PM part of blelightsleepdiag::begin()
; without the light-sleep options, the AUTOLS macro or the controller/RTC
; log lines; CROSSPOINT_BLE_LIGHT_SLEEP_DIAG stays undefined. Same
; rebuilt-core recipe, TinyUSB restore, NimBLE roles and MSCDIAG
; instrumentation as x4c-coreonly. The board lines, the wrap list and
; extra_scripts below are literal copies of x4c-coreonly's, so change them
; together. Production envs untouched.
;   pio run -e x4c-pmonly -t upload
[env:x4c-pmonly]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
custom_sdkconfig =
  ${firmware_tuned.custom_sdkconfig}
  ; Same NimBLE role restoration as x4c-coreonly: the companion builds and
  ; runs here too — the radio stack is not the variable under test.
  CONFIG_BT_NIMBLE_ROLE_PERIPHERAL=y
  CONFIG_BT_NIMBLE_ROLE_BROADCASTER=y
  ; TinyUSB restored from the prebuilt core's component (see
  ; scripts/fetch_arduino_tinyusb.sh); USBMSC.h needs these symbols to expose
  ; the MSC class.
  CONFIG_TINYUSB_ENABLED=y
  CONFIG_TINYUSB_MSC_ENABLED=y
  ; The P1-B1k variable under test: CPU frequency scaling only. Tickless idle
  ; and BT modem sleep stay off so automatic light sleep cannot engage from
  ; the idle task or the controller.
  CONFIG_PM_ENABLE=y
  CONFIG_FREERTOS_USE_TICKLESS_IDLE=n
  CONFIG_BT_CTRL_MODEM_SLEEP=n
build_flags =
  ${env:x4c.build_flags}
  ; p1-b1k: the MSCDIAG instrumentation, copied verbatim from [env:x4c-blelp]
  ; (env:x4c itself does NOT carry it). Link-time interpositions only;
  ; production sources stay byte-untouched. Re-run the p1-b1g call-site census
  ; after an Arduino-core bump, an SDK display-stack change, or a board
  ; SPI-map change: a stale mangled name silently unhooks the gate.
  -DCROSSPOINT_USB_MSC_DIAG=1
  -Wl,--wrap=_ZN10HalStorage5beginEv
  -Wl,--wrap=_ZN10HalStorage13beginUsbDriveEv
  -Wl,--wrap=_ZN7freeink14UsbMassStorage5beginEP22FsBlockDeviceInterface
  -Wl,--wrap=_ZN10HalStorage22disconnectUsbDriveHostEv
  -Wl,--wrap=_ZN10HalStorage11endUsbDriveEv
  -Wl,--wrap=_ZNK10HalStorage13usbDriveStateEv
  -Wl,--wrap=_ZNK10HalStorage21usbDriveHostSuspendedEv
  -Wl,--wrap=_ZN15ActivityManager4loopEv
  -Wl,--wrap=sdmmc_read_sectors
  -Wl,--wrap=sdmmc_write_sectors
  -Wl,--wrap=tud_mounted
  -Wl,--wrap=tud_suspended
  -Wl,--wrap=_ZN8SPIClass8transferEh
  -Wl,--wrap=_ZN8SPIClass10writeBytesEPKhm
  ; The PM-only initialization: esp_pm_configure DFS range with automatic
  ; light sleep off; a failed configure halts the boot.
  -DCROSSPOINT_PM_ONLY_DIAG=1
extra_scripts =
  ${base.extra_scripts}
  post:scripts/restore_libs_sdkconfig.py

; P1-B1l, leg (b): B1k failed USB-MSC with the DFS floor at 40 MHz, so this
; env raises the floor to 80 MHz via CROSSPOINT_PM_MIN_FREQ — CPU and APB stay
; on the PLL at idle, the XTAL-floor state is eliminated, and DFS is
; reduced to 240<->80 switching. Everything else is identical to
; [env:x4c-pmonly]: same sdkconfig (CONFIG_PM_ENABLE=y, tickless idle and BT
; modem sleep off, no EXT-32K/LPCLK), same rebuilt-core recipe, TinyUSB
; restore, NimBLE roles and MSCDIAG instrumentation. If this also fails,
; "PM/DFS breaks USB-MSC" is promoted to a conclusion; if it passes, the fault
; localizes to the 40 MHz XTAL floor. The board lines, the wrap list and
; extra_scripts below are literal copies of x4c-pmonly's, so change them
; together. Production envs untouched.
;   pio run -e x4c-pm80 -t upload
[env:x4c-pm80]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
custom_sdkconfig =
  ${firmware_tuned.custom_sdkconfig}
  ; Same NimBLE role restoration as x4c-pmonly: the companion builds and
  ; runs here too — the radio stack is not the variable under test.
  CONFIG_BT_NIMBLE_ROLE_PERIPHERAL=y
  CONFIG_BT_NIMBLE_ROLE_BROADCASTER=y
  ; TinyUSB restored from the prebuilt core's component (see
  ; scripts/fetch_arduino_tinyusb.sh); USBMSC.h needs these symbols to expose
  ; the MSC class.
  CONFIG_TINYUSB_ENABLED=y
  CONFIG_TINYUSB_MSC_ENABLED=y
  ; Identical to x4c-pmonly: CPU frequency scaling only. Tickless idle and BT
  ; modem sleep stay off so automatic light sleep cannot engage from the idle
  ; task or the controller.
  CONFIG_PM_ENABLE=y
  CONFIG_FREERTOS_USE_TICKLESS_IDLE=n
  CONFIG_BT_CTRL_MODEM_SLEEP=n
build_flags =
  ${env:x4c.build_flags}
  ; p1-b1l: the MSCDIAG instrumentation, copied verbatim from [env:x4c-blelp]
  ; (env:x4c itself does NOT carry it). Link-time interpositions only;
  ; production sources stay byte-untouched. Re-run the p1-b1g call-site census
  ; after an Arduino-core bump, an SDK display-stack change, or a board
  ; SPI-map change: a stale mangled name silently unhooks the gate.
  -DCROSSPOINT_USB_MSC_DIAG=1
  -Wl,--wrap=_ZN10HalStorage5beginEv
  -Wl,--wrap=_ZN10HalStorage13beginUsbDriveEv
  -Wl,--wrap=_ZN7freeink14UsbMassStorage5beginEP22FsBlockDeviceInterface
  -Wl,--wrap=_ZN10HalStorage22disconnectUsbDriveHostEv
  -Wl,--wrap=_ZN10HalStorage11endUsbDriveEv
  -Wl,--wrap=_ZNK10HalStorage13usbDriveStateEv
  -Wl,--wrap=_ZNK10HalStorage21usbDriveHostSuspendedEv
  -Wl,--wrap=_ZN15ActivityManager4loopEv
  -Wl,--wrap=sdmmc_read_sectors
  -Wl,--wrap=sdmmc_write_sectors
  -Wl,--wrap=tud_mounted
  -Wl,--wrap=tud_suspended
  -Wl,--wrap=_ZN8SPIClass8transferEh
  -Wl,--wrap=_ZN8SPIClass10writeBytesEPKhm
  ; The PM-only initialization with the leg-(b) DFS floor: 80 MHz keeps CPU
  ; and APB on the PLL at idle; a failed configure halts the boot.
  -DCROSSPOINT_PM_ONLY_DIAG=1
  -DCROSSPOINT_PM_MIN_FREQ=80
extra_scripts =
  ${base.extra_scripts}
  post:scripts/restore_libs_sdkconfig.py

; P1-B1n: the B1m-derived target configuration on top of the p1-b1l control
; (x4c-pm80, PASS). Adds automatic light sleep — tickless idle on and
; light_sleep_enable in pmonlydiag::begin — and nothing else from the BLE-LS
; cluster: BT modem sleep, EXT-32K and LPCLK stay untouched. USB MSC sessions
; are protected from light sleep for their whole OTG lifetime by a
; NO_LIGHT_SLEEP lock owned by HalStorage (CROSSPOINT_USB_SESSION_PM_LOCK):
; from stack bring-up through the synchronous teardown drain in
; UsbMassStorage::end(), released only after the host disconnect completes.
; CONFIG_PM_PROFILING makes the PMSTAT serial dump carry per-mode time and
; light-sleep entry counts, the hardware evidence that light sleep works
; outside and stays out during USB sessions. The build flags and sdkconfig
; are inherited from x4c-pm80 by reference (see the nols twin above for the
; pattern); the board lines below are literal copies of x4c-pm80's, so
; change them together. Production envs untouched.
;   pio run -e x4c-pm80ls -t upload
[env:x4c-pm80ls]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
custom_sdkconfig =
  ${env:x4c-pm80.custom_sdkconfig}
  ; The B1n variables under test: automatic light sleep needs tickless idle
  ; (esp_pm_configure rejects light_sleep_enable without it), and PM
  ; profiling feeds the PMSTAT dump with light-sleep entry counts.
  CONFIG_FREERTOS_USE_TICKLESS_IDLE=y
  CONFIG_PM_PROFILING=y
build_flags =
  ${env:x4c-pm80.build_flags}
  ; p1-b1n: automatic light sleep on, and the USB session lock in HalStorage.
  -DCROSSPOINT_PM_AUTOLS=1
  -DCROSSPOINT_USB_SESSION_PM_LOCK=1
extra_scripts =
  ${base.extra_scripts}
  post:scripts/restore_libs_sdkconfig.py

; P1-B1o: the controlled light-sleep measurement harness on top of the p1-b1n
; configuration (x4c-pm80ls, PASS). The sdkconfig (tickless idle + PM
; profiling) is inherited from x4c-pm80ls by reference; the build flags are
; inherited from x4c-pm80 by reference — which carries NO CROSSPOINT_PM_AUTOLS
; define, so PmOnlyDiag's default (0) keeps automatic light sleep OFF at boot
; (the safe state this experiment must boot into after every reset). The
; harness itself is the CMD:LSTEST window in PmOnlyDiag: boot-state snapshot,
; esp_pm_configure(240/80, ON), a 5 s unattended window on the loop task's own
; FreeRTOS deadline, configure(OFF), delta computation, one SD report write to
; /diagnostics/light-sleep-test.txt. The USB session lock stays (a USB Drive
; session must keep its NO_LIGHT_SLEEP protection; LSTEST refuses to run while
; USB Drive owns the storage). The board lines below are literal copies of
; x4c-pm80's, so change them together. Production envs untouched.
;   pio run -e x4c-lstest -t upload
[env:x4c-lstest]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
custom_sdkconfig =
  ${env:x4c-pm80ls.custom_sdkconfig}
build_flags =
  ${env:x4c-pm80.build_flags}
  ; p1-b1o: the USB session lock (same contract as x4c-pm80ls) and the
  ; controlled light-sleep window. No AUTOLS define here: boot stays OFF.
  -DCROSSPOINT_USB_SESSION_PM_LOCK=1
  -DCROSSPOINT_PM_LSTEST=1
extra_scripts =
  ${base.extra_scripts}
  post:scripts/restore_libs_sdkconfig.py

; P1-B2a: BLE-aware automatic light sleep in the Sleep Companion gate window
; (experimental). The sdkconfig is x4c-blelp's (modem sleep MODE_1 on the
; external 32k crystal, PM + tickless, TinyUSB restored) plus PM profiling so
; the sleep counters exist to read; the build flags are x4c-blelp's by
; reference with four additions: the boot keeps the safe autols-OFF state
; (AUTOLS=0) at the USB-MSC-safe 80 MHz floor (p1-b1l), the USB session keeps
; its NO_LIGHT_SLEEP protection (p1-b1n), and the gate window itself runs
; esp_pm(240/80, ON) with sleep accounting (CROSSPOINT_COMPANION_GATE_AUTOLS,
; CompanionGatePower). Reading mode and the USB-MSC policy are untouched; the
; UAT scenario is advertising -> light sleep -> BLE connection -> delivery.
;   pio run -e x4c-bleautols -t upload
[env:x4c-bleautols]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
custom_sdkconfig =
  ${env:x4c-blelp.custom_sdkconfig}
  CONFIG_PM_PROFILING=y
build_flags =
  ${env:x4c-blelp.build_flags}
  -DCROSSPOINT_BLE_LIGHT_SLEEP_AUTOLS=0
  -DCROSSPOINT_BLE_LIGHT_SLEEP_MIN_FREQ=80
  -DCROSSPOINT_USB_SESSION_PM_LOCK=1
  -DCROSSPOINT_COMPANION_GATE_AUTOLS=1
extra_scripts = ${env:x4c-blelp.extra_scripts}

; P1-B3: the control twin of x4c-bleautols for the headless gate BLE
; connection test. Everything is inherited by reference — NimBLE stack and
; configuration, advertising/security/bond, RTC wake and identity mirror, the
; 15 s gate window, the 15 ms poll cadence, PM profiling, the USB session
; lock and the USB diagnostic override — and the single substantive variable
; is the gate window's esp_pm_configure light_sleep_enable: true in the
; experimental build, false here (CROSSPOINT_COMPANION_GATE_NO_LIGHT_SLEEP).
; The control build keeps GATESTAT and reports "Gate automatic light sleep
; OFF"; its windows never accumulate sleep totals (windowCounts), so a
; no-light-sleep window is never mistaken for the experimental build's
; metrics-collection failure. NOT a production environment.
